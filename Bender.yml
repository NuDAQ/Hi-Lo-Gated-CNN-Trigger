# Package metadata. Required.
package:
  # The name of the package. Required.
  name: hilo-gated-cnn-trigger

  # The list of package authors and contributors. Optional.
  # By convention, authors should be listed in the form shown below.
  authors: ["Albert ZHANG <albert.zhang@cern.ch>"]

  # A short description of the package. Optional.
  description: "This is a Hi-Lo gated AI Trigger."

  # Other packages this package depends on. Optional.
dependencies:
  # Path dependency.
  cnn-core-wrapper: { git: "git@github.com:NuDAQ/CNN-Core-Wrapper.git", version: "1.0.1" }
  hilo-trigger: { git: "git@github.com:NuDAQ/Hi-Lo-Trigger.git", version: "2.1.2" }

sources:
  - hw/rtl/CNN_FIFO_CONNECTOR.vhd
  - hw/rtl/HILO_PATH_WRAPPER.vhd
  - hw/rtl/TEMP_SYS_TOP.vhd
  - target: sim
    files:
      - hw/rtl/sim/tb_temp_sys_top.sv
      - hw/sim/TEMP_SYS_TOP_TB_WRAP.vhd
